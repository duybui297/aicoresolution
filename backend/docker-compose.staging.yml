version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicoresolution-db-staging
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB_STAGING}
      POSTGRES_USER: ${POSTGRES_USER_STAGING}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_STAGING}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_STAGING}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicoresolution-staging-network

  backend:
    image: ${DOCKER_REGISTRY}/aicoresolution-backend:${IMAGE_TAG}
    container_name: aicoresolution-backend-staging
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_STAGING}
      DB_USERNAME: ${POSTGRES_USER_STAGING}
      DB_PASSWORD: ${POSTGRES_PASSWORD_STAGING}
      APP_JWT_SECRET: ${APP_JWT_SECRET_STAGING}
      APP_ACCESS_TOKEN_MINUTES: ${APP_ACCESS_TOKEN_MINUTES}
      APP_REFRESH_TOKEN_MINUTES: ${APP_REFRESH_TOKEN_MINUTES}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS_STAGING}
      APP_UPLOAD_DIR: /app/uploads
    ports:
      - "8082:8080"
    volumes:
      - /var/aicoresolution/staging/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aicoresolution-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_staging:
    driver: local

networks:
  aicoresolution-staging-network:
    driver: bridge
