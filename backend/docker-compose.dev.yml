version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicoresolution-db-dev
    restart: always
    environment:
      POSTGRES_DB: aicoresolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicoresolution-backend-dev
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/aicoresolution
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_JWT_SECRET: your-super-secret-jwt-key-change-in-production
      APP_ACCESS_TOKEN_MINUTES: 15
      APP_REFRESH_TOKEN_MINUTES: 10080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      APP_UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data_dev:

networks:
  default:
    name: aicoresolution-network
